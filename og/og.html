<!doctype html>
<!-- 分享預覽圖原稿（1200×630）。重新產生：用 Edge 無頭模式截圖成 ../og-image.png -->
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Microsoft JhengHei', 'Noto Sans TC', sans-serif;
    background: #f6efe2; color: #2b2a33; position: relative;
  }
  .frame { position: absolute; inset: 22px; border: 4px solid #2b2a33; border-radius: 34px; overflow: hidden; background: #fffaf0; }
  .left { position: absolute; left: 60px; top: 48px; width: 580px; }
  .cranes { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 10px; }
  h1 { font-size: 70px; font-weight: 900; margin: 0; line-height: 1.15; letter-spacing: 2px; white-space: nowrap; }
  .sub { font-size: 32px; font-weight: 700; color: #d94b4b; margin: 12px 0 18px; }
  .desc { font-size: 25px; line-height: 1.55; color: #4a4852; margin: 0 0 22px; }
  .tags { display: flex; flex-wrap: wrap; gap: 12px; }
  .tag { font-size: 22px; font-weight: 700; padding: 8px 18px; border-radius: 999px; border: 3px solid #2b2a33; background: #fff; }
  .tag.gold { background: #e8b33a; }
  .tag.blue { background: #dcebff; }
  .map { position: absolute; right: 36px; top: 36px; width: 450px; height: 514px; border-radius: 26px; border: 3px solid #e2d6bf; overflow: hidden; }
  .url { position: absolute; left: 60px; bottom: 30px; font-size: 22px; color: #6d6a75; font-weight: 700; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="crane" viewBox="0 0 64 64">
      <g stroke="#2b2a33" stroke-width="1.6" stroke-linejoin="round">
        <polygon points="6,16 31,36 24,42"/><polygon points="58,16 33,36 40,42"/>
        <polygon points="42,42 55,26 51,26 37,40"/><polygon points="22,42 9,24 13,24 27,40"/>
        <polygon points="9,24 3,26 11,20"/><polygon points="22,42 32,32 42,42 32,52"/>
      </g>
      <circle cx="29" cy="42" r="1.8" fill="#2b2a33"/><circle cx="35" cy="42" r="1.8" fill="#2b2a33"/>
    </symbol>
  </defs>
</svg>

<div class="frame">
  <div class="left">
    <div class="cranes">
      <svg width="80" height="80" fill="#d94b4b"><use href="#crane"/></svg>
      <svg width="62" height="62" fill="#e8b33a"><use href="#crane"/></svg>
      <svg width="70" height="70" fill="#3b7dd8"><use href="#crane"/></svg>
    </div>
    <h1>和平紙鶴大冒險</h1>
    <p class="sub">給孩子的廣島歷史探險地圖</p>
    <p class="desc">走遍廣島、宮島和吳市，回答問題收集紙鶴，<br>認識二戰歷史，也聽聽台灣的故事。</p>
    <div class="tags">
      <span class="tag gold">🦢 答題收集紙鶴</span>
      <span class="tag blue">📖 台灣連結</span>
      <span class="tag">👨‍👩‍👦 親子旅行</span>
    </div>
  </div>

  <svg class="map" viewBox="0 0 400 430" preserveAspectRatio="xMidYMid slice">
    <rect width="400" height="430" fill="#bfe3ef"/>
    <path fill="#ece0c3" stroke="#d3c39d" stroke-width="2" d="M0,0 H400 V210 C360,222 338,250 358,280 C378,300 372,330 330,336 C300,284 262,262 232,260 C204,276 182,262 152,252 C122,242 100,262 60,252 C30,246 12,232 0,242 Z"/>
    <ellipse cx="70" cy="300" rx="50" ry="34" fill="#ece0c3" stroke="#d3c39d" stroke-width="2"/>
    <!-- 廣島市中心六條河（示意） -->
    <path d="M120,-40 C90,40 40,110 28,248" fill="none" stroke="#9fd0e2" stroke-width="5" stroke-linecap="round"/>
    <path d="M140,-40 C120,50 80,130 72,252" fill="none" stroke="#9fd0e2" stroke-width="5" stroke-linecap="round"/>
    <path d="M150,-40 C140,60 118,140 112,246" fill="none" stroke="#9fd0e2" stroke-width="5" stroke-linecap="round"/>
    <path d="M128,110 C150,140 178,180 182,258" fill="none" stroke="#9fd0e2" stroke-width="5" stroke-linecap="round"/>
    <path d="M160,0 C230,30 285,90 285,264" fill="none" stroke="#9fd0e2" stroke-width="5" stroke-linecap="round"/>
    <path d="M283,120 C300,160 310,220 305,288" fill="none" stroke="#9fd0e2" stroke-width="5" stroke-linecap="round"/>
    <g stroke="#d94b4b" stroke-width="3" stroke-dasharray="7 6" fill="none">
      <polyline points="195,50 245,100 142,215 205,165 70,300 300,315 345,375"/>
    </g>
    <g font-size="24" text-anchor="middle">
      <g transform="translate(195,50)"><circle r="24" fill="#fff" stroke="#2b2a33" stroke-width="2.5"/><text y="8">🏯</text></g>
      <g transform="translate(245,100)"><circle r="24" fill="#fff" stroke="#2b2a33" stroke-width="2.5"/><text y="8">🌳</text></g>
      <g transform="translate(205,165)"><circle r="24" fill="#fff" stroke="#2b2a33" stroke-width="2.5"/><text y="8">🏛️</text></g>
      <g transform="translate(142,215)"><circle r="24" fill="#fff3c4" stroke="#e8b33a" stroke-width="4"/><text y="8">🕊️</text></g>
      <g transform="translate(70,300)"><circle r="24" fill="#fff" stroke="#2b2a33" stroke-width="2.5"/><text y="8">⛩️</text></g>
      <g transform="translate(300,315)"><circle r="24" fill="#fff" stroke="#2b2a33" stroke-width="2.5"/><text y="8">⚓</text></g>
      <g transform="translate(345,375)"><circle r="24" fill="#fff" stroke="#2b2a33" stroke-width="2.5"/><text y="8">🐋</text></g>
    </g>
    <g font-size="16" font-weight="700" fill="#2b2a33" opacity=".75">
      <text x="225" y="250">廣島市</text><text x="40" y="355">宮島</text><text x="330" y="270">吳市</text>
    </g>
  </svg>

  <div class="url">meipharm.github.io/peace-crane-quest</div>
</div>
</body>
</html>
